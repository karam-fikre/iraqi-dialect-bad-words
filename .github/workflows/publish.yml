name: Publish to npm

# Runs when you publish a GitHub Release (e.g. tag v1.0.1).
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# One-time setup: on npmjs.com, open the package settings > Trusted Publisher,
# and add this repository with the workflow file name "publish.yml".

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
